[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-manager"
version = "0.1.0"
description = "Foundation for a local Windows SIM manager."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8,<7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sim_manager*"]

[tool.setuptools.package-data]
"sim_manager.resources" = ["*.json", "*.pem"]
